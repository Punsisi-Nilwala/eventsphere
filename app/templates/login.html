{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h3>Sign in</h3>
<form method="post" action="/login" class="card card-body">
 <input type="hidden" name="csrf_token" value="{{ csrf }}">
 <label class="form-label">Email</label><input class="form-control mb-2" type="email" name="email" required>
 <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
 <button class="btn btn-primary">Sign in</button>
</form>
<p class="mt-3">No account? <a href="/register">Register</a></p>
</div></div>
{% endblock %}
