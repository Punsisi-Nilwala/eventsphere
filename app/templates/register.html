{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h3>Create an attendee account</h3>
<form method="post" action="/register" class="card card-body">
 <input type="hidden" name="csrf_token" value="{{ csrf }}">
 <label class="form-label">Full name</label><input class="form-control mb-2" name="name" required>
 <label class="form-label">Email</label><input class="form-control mb-2" type="email" name="email" required>
 <label class="form-label">Password (min 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required>
 <button class="btn btn-primary">Register</button>
</form></div></div>
{% endblock %}
