{% extends "base.html" %}{% block title %}Venue{% endblock %}
{% block content %}
<h3>{{ 'Edit' if v else 'New' }} venue</h3>
<form method="post" action="/admin/venues/save" class="card card-body">
 <input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="venue_id" value="{{ v.id if v else '' }}">
 <div class="row g-2">
  <div class="col-12 col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ v.name if v else '' }}" required></div>
  <div class="col-12 col-md-6"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ v.location if v else '' }}"></div>
  <div class="col-6 col-md-3"><label class="form-label">Capacity</label><input class="form-control" type="number" min="1" name="capacity" value="{{ v.capacity if v else '' }}" required></div>
  <div class="col-6 col-md-3"><label class="form-label">Hourly hire rate (LKR)</label><input class="form-control" type="number" min="0" step="0.01" name="hourly_rate" value="{{ v.hourly_rate if v else 0 }}"></div>
  <div class="col-12 col-md-6"><label class="form-label">Image URL</label><input class="form-control" name="image_url" value="{{ v.image_url if v else '' }}"></div>
  <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3">{{ v.description if v else '' }}</textarea></div>
  <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="open_for_hire" value="1" id="hire" {% if v and v.open_for_hire %}checked{% endif %}><label class="form-check-label" for="hire">Open for private hire</label></div></div>
  <div class="col-12"><button class="btn btn-primary">Save venue</button></div>
 </div>
</form>
{% endblock %}
